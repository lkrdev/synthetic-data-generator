# =============================================================================
# WORKSPACE & UMBRELLA PACKAGE CONFIGURATION
# =============================================================================

[project]
name = "synthetic-data-generator"
version = "0.1.0"
description = "General framework for synthetic data generation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "anyascii>=0.3.3,<1",
    "asciichartpy>=1.5.25,<2",
    "chardet>=3.0.2,<6",
    "cryptography>=48.0.1,<=49",
    "duckdb>=1.5.0,<2",
    "faker>=20.1.0,<21",
    "fsspec>=2025.3.0,<2026",
    "google-auth>=2.30.0,<3",
    "httpx>=0.27.2,<1",
    "httpx-retries>=0.4.2,<1",
    "huggingface-hub>=1.0.1,<2",
    "idna>=3.18,<4",
    "jinja2>=3.1.6,<4",
    "json-repair>=0.48.0,<1",
    "jsonpath-rust-bindings>=1.0,<2",
    "jsonschema>=4.0.0,<5",
    "lxml>=6.1.0,<7",
    "marko>=2.1.2,<3",
    "mcp>=1.29.0,<2",
    "networkx>=3.0,<4",
    "numpy>=1.23.5,<3",
    "opentelemetry-api>=1.43,<1.44",
    "opentelemetry-exporter-prometheus>=0.64b0,<0.65",
    "opentelemetry-sdk>=1.43,<1.44",
    "packaging>=25,<27",
    "pandas>=2.3.3,<3",
    "pillow>=12.3.0,<13",
    "prometheus-client>=0.24,<1",
    "prompt-toolkit>=3.0.0,<4",
    "pyarrow>=24,<25",
    "pydantic>=2.9.2,<3",
    "pygments>=2.20,<3",
    "pyjwt[crypto]>=2.13.0,<3",
    "python-json-logger>=3,<4",
    "python-multipart>=0.0.32,<1",
    "pyyaml>=6.0.1,<7",
    "requests>=2.33,<3",
    "rich>=13.7.1,<15",
    "ruff>=0.14.10,<1",
    "scipy>=1.11.0,<2",
    "sqlfluff>=4.1.0,<5",
    "starlette>=1.2.0,<2",
    "tiktoken>=0.8.0,<1",
    "typer>=0.12.0,<1",
    "urllib3>=2.7.0,<3",
    "wcwidth>=0.2.13,<1",
]

[project.scripts]
data-designer = "data_designer.cli.main:main"
data-designer-mcp = "data_designer.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = [
    "packages/data-designer",
    "packages/data-designer-config",
    "packages/data-designer-engine",
]

[tool.uv]
package = true
required-version = ">=0.7.10"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/data-designer/src/data_designer",
    "packages/data-designer-config/src/data_designer",
    "packages/data-designer-engine/src/data_designer",
]

[tool.uv.sources]
# Temporary immutable pin to jupyter/nbconvert#2300, which replaces the EOL
# Bleach dependency with nh3. Return to PyPI after the upstream fix is released.
nbconvert = { git = "https://github.com/jupyter/nbconvert.git", rev = "1fab6813f44f89017e7bcad27578571447b5b9c2" }

[dependency-groups]
dev = [
    "jsonpath-ng>=1.5.3,<2",
    "pre-commit>=4.0.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
    "pytest-env>=1.2.0,<2",
    "pytest-httpx>=0.36.0,<1",
    "ruff>=0.14.10,<1",
]
license-check = [
    "tomli>=2.0.1,<3; python_version < '3.11'",
]
docs = [
    "jupytext>=1.16.0,<2",
]
notebooks = [
    "aiohttp>=3.14.3,<4",
    "datasets>=4.0.0,<5",
    "ipykernel>=6.29.0,<7",
    "jupyter>=1.0.0,<2",
    "jupyter-server>=2.20.0,<3",
    "jupyterlab>=4.6.0a5,<5",
    "mistune>=3.3.2,<4",
    "nbconvert>=7.17.1,<8",
    "notebook>=7.6.0a5,<8",
    "setuptools>=83.0.0,<84",
    "soupsieve>=2.9.1,<3",
    "tornado>=6.5.7,<7",
]
recipes = [
    "bm25s>=0.2.0,<1",
    "pymupdf>=1.24.0,<2",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
env = ["DISABLE_DATA_DESIGNER_PLUGINS=true"]

[tool.coverage.run]
omit = ["**/engine/models/telemetry.py"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie (misc lints)
    "TID",   # flake8-tidy-imports (ban relative imports)
    "UP006", # List[A] -> list[A]
    "UP007", # Union[A, B] -> A | B
    "UP045", # Optional[A] -> A | None
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any)
]

[tool.ruff.lint.isort]
known-first-party = ["data_designer", "data_designer_e2e_tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

